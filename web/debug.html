<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>사주팔자PLAY debug (개발 전용)</title>
<style>
body{margin:0;background:#101226;color:#e8e6f6;font:14px/1.5 ui-monospace,Consolas,monospace}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 10px;color:#FFB347}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:12px;color:#a9a8c9}
input,select,button{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid #3a3e72;background:#20234a;color:#e8e6f6}
button{background:#4ED1B0;color:#101226;font-weight:700;cursor:pointer}
details{border:1px solid #3a3e72;border-radius:8px;margin:8px 0;padding:6px 10px;background:#171936}
summary{cursor:pointer;color:#4ED1B0}
pre{white-space:pre-wrap;word-break:break-all;margin:6px 0 0;font-size:12.5px}
table{border-collapse:collapse;margin-top:6px}td,th{border:1px solid #3a3e72;padding:3px 8px;text-align:left}
.warn{color:#FF8FA3}
</style>
</head>
<body>
<div class="wrap">
  <h1>사주팔자PLAY debug · 개발 빌드 전용 (Production 빌드에는 포함되지 않음)</h1>
  <form id="f">
    <label>birthDate<input id="d" type="date" value="1990-05-15"></label>
    <label>birthTime<input id="t" type="time" value="14:20"></label>
    <label>시간 미상<input id="u" type="checkbox"></label>
    <label>gender<select id="g"><option value="female">female</option><option value="male">male</option></select></label>
    <label>overlapChoice<select id="o"><option value="">(none)</option><option value="earlier">earlier</option><option value="later">later</option></select></label>
    <label>jasiPolicy<select id="j"><option value="midnight">midnight</option><option value="jasi">jasi</option><option value="splitJasi">splitJasi</option></select></label>
    <button type="submit">계산</button>
  </form>
  <div id="out"></div>
</div>
<script src="./assets/debug.js" defer></script>
</body>
</html>
