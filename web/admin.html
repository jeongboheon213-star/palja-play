<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>팔자PLAY · 피드백 관리자</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202738;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#18203a;color:white;padding:24px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center}header small{color:#adc0dd}main{max-width:1200px;margin:auto;padding:28px 24px}h1{font-size:25px;margin:4px 0}h2{font-size:19px;margin:0 0 18px}p{line-height:1.6}.muted{color:#64748b;font-size:14px}a{color:inherit}button,select,input{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;background:white;color:#26334b}button{cursor:pointer}button.primary{background:#344dbe;color:white;border-color:#344dbe}button:disabled{opacity:.5}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:20px}label{display:grid;gap:6px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:white;border:1px solid #e0e5ee;border-radius:14px;padding:22px}.card strong{display:block;font-size:32px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}.panel{margin-bottom:18px}.grid .panel{margin:0}.barrow{display:grid;grid-template-columns:80px 1fr 45px;align-items:center;gap:12px;margin:13px 0;font-size:14px}.track{height:12px;border-radius:8px;background:#edf1f7;overflow:hidden}.fill{background:#4f67d5;height:100%;border-radius:8px}.bad{background:#dc796a}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}th,td{padding:12px 10px;border-bottom:1px solid #e9edf4;vertical-align:top}th{color:#60718a;font-weight:600;white-space:nowrap}.comment{min-width:240px;max-width:440px;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#eef1fb;margin:2px;font-size:12px}.notice{padding:16px;background:#fff6df;border-radius:10px;line-height:1.6}.error{color:#b42318}svg{width:100%;height:160px}#status{margin:0 0 20px}.empty{padding:32px;color:#64748b;text-align:center}@media(max-width:750px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}header{padding:20px}main{padding:20px 14px}.card{padding:16px}.card strong{font-size:26px}}

<div class="toolbar"><label>조회 기간<select id="period"><option value="7">최근 7일</option><option value="30" selected>최근 30일</option><option value="90">최근 90일</option></select></label><label>해석 버전<select id="version"><option value="">전체 버전</option></select></label><label>공감 점수<select id="score"><option value="">전체 점수</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>의견 검색<input id="search" placeholder="예: 설명, 결제, 공유" maxlength="100"></label><button class="primary" id="refresh">새로고침</button><button id="export" disabled>CSV 저장</button></div>
<p id="status" role="status" aria-live="polite">피드백을 불러오는 중입니다.</p><div id="dashboard"></div>
<p class="muted">이 화면은 제출된 피드백을 집계합니다. 방문자 전체의 의견을 대표하지 않으며, 테스트 제출도 포함될 수 있어요. 시간은 한국 기준이고 조회 기간은 현재부터 7·30·90일입니다. 자유 의견에는 작성자가 입력한 개인정보가 포함될 수 있으니 관리자만 열람하세요.</p>
</main><script src="/assets/admin.js" defer></script></body></html>
